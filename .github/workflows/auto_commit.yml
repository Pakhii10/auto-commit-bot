name: Auto Commit + PR

on:
  schedule:
    - cron: '0 10 * * *'
  workflow_dispatch:

jobs:
  auto-flow:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      # ✅ Step 1: Make change
      - name: Make changes
        run: echo "Updated on $(date)" >> log.txt

      # ✅ Step 2: Commit & push new branch
      - name: Commit & Push
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          BRANCH=auto-branch-$(date +%s)
          git checkout -b $BRANCH
          git add .
          git commit -m "Auto commit"
          git push origin $BRANCH

      # ✅ Step 3: Create PR using GitHub CLI
      - name: Install GitHub CLI
        run: sudo apt update && sudo apt install gh -y

      - name: Create Pull Request
        run: |
          BRANCH=$(git branch --show-current)
          gh pr create --title "Auto PR" --body "Automated PR" --base main --head $BRANCH
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ✅ Step 4: Merge PR
      - name: Merge PR
        run: |
          gh pr merge --auto --merge
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}